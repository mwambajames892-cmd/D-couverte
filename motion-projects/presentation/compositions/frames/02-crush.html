      gsap.set($("dw"), { x: 0 });
      fl($("prail"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.2, ease: "power2.out" }, 0.14);
      fl($("pfill"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 0.30);
      fl($("dot"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 0.30);
      prog(0, 0.55, 0.30, 1.60, "none");        // 0 → 55 % jusqu'à 1.90
      prog(0.55, 0.60, 1.90, 1.34, "none");     // 60 % à 3.24
      prog(0.60, 0.92, 3.50, 0.50, "power2.out"); // saut à 92 %
      prog(0.92, 0.95, 4.82, 0.10, "power2.out"); // frémissement
      prog(0.95, 0.92, 4.92, 0.13, "power2.inOut");
      // le point brille à 3.90
      fl($("glow"), { opacity: 0, scale: 0.6 }, { opacity: 0.9, scale: 1.5, duration: 0.2, ease: "power2.out" }, 3.90);
      fl($("glow"), { opacity: 0.9, scale: 1.5 }, { opacity: 0, scale: 1.0, duration: 0.4, ease: "power1.in" }, 4.10);

      // ---------- scène 2 : la notification « Crush » tombe sur la vidéo ----------
      fl($("nsh"), { opacity: 0 }, { opacity: 0.14, duration: 0.12, ease: "power1.out" }, 1.30);
      fl($("nsh"), { opacity: 0.14 }, { opacity: 0, duration: 0.14, ease: "power1.in" }, 1.52);
      fl($("n"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 1.42);
      fl($("n"), { y: -110, scale: 1.14, filter: "blur(10px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 1.42);
      // le point pulse deux fois
      [1.60, 1.88].forEach(function (t0) {
        fl($("nd"), { scale: 1 }, { scale: 1.5, duration: 0.14, ease: "sine.out", transformOrigin: "50% 50%" }, t0);
        fl($("nd"), { scale: 1.5 }, { scale: 1, duration: 0.14, ease: "sine.in", transformOrigin: "50% 50%" }, t0 + 0.14);
      });
      // vibration de 6 px (3 allers-retours)
      [6, -6, 6, -6, 6, 0].forEach(function (x, i) {
        fl($("n"), { x: i === 0 ? 0 : [6, -6, 6, -6, 6, 0][i - 1] }, { x: x, duration: 0.04, ease: "none" }, 2.10 + 0.04 * i);
      });
      // cran de caméra vers la notification
      fl($("cam"), { scale: 1 }, { scale: 1.05, duration: 0.28, ease: "expo.out" }, 1.42);
      // le curseur « ← IGNORER »
      fl($("chip"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.2, ease: "power2.out" }, 2.80);

      // ---------- scène 3 : balayée à gauche, traînée, la barre saute à 92 % ----------
      function sweep(el, k, t0, op0) {
        fl(el, { x: 0 }, { x: -420 * k, duration: 0.22, ease: "power3.in" }, t0);
        fl(el, { x: -420 * k }, { x: -1250 * k, duration: 0.16, ease: "none" }, t0 + 0.22);
      }
      sweep($("n"), 1, 3.24);
      fl($("n"), { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.22, ease: "power3.in" }, 3.24);
      tl.set($("n"), { opacity: 0 }, 3.62);
      tl.set($("ng1"), { opacity: 0.28 }, 3.26);
      tl.set($("ng2"), { opacity: 0.13 }, 3.28);
      sweep($("ng1"), 1.31, 3.24);
      sweep($("ng2"), 1.6, 3.24);
      tl.set($("ng1"), { opacity: 0 }, 3.62);
      tl.set($("ng2"), { opacity: 0 }, 3.62);
      fl($("chip"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in" }, 3.78);
      // petit cran caméra à gauche (+40) pour suivre la notification, puis retour à l'axe et à l'échelle 1
      fl($("cam"), { x: 0 }, { x: 40, duration: 0.22, ease: "expo.out" }, 3.24);
      fl($("cam"), { x: 40, scale: 1.05 }, { x: 0, scale: 1, duration: 0.8, ease: "power2.inOut" }, 3.70);
      // le trait vert-bleu sous « ignores »
      fl($("trait"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, 3.50);

      // ---------- scène 4 : le « ? » paraît derrière, le post recule ----------
      fl($("next"), { opacity: 0.75 }, { opacity: 0, duration: 0.35, ease: "power1.in" }, 4.0);
      fl($("q"), { opacity: 0 }, { opacity: 0.7, duration: 0.3, ease: "power1.out" }, 4.40);
      // cible : centre du post à (540, 760) à 5.6 s, échelle 0,5, flou 12 px
      var yEnd = 760 - (T + 886 / 2) + 30 * DUR;
      fl($("post"), { scale: 1, filter: "blur(0px)", y: 0 }, { scale: 0.5, filter: "blur(12px)", y: yEnd, duration: 0.55, ease: "power3.in" }, 5.0);

      // ---------- sous-titres : mot par mot, quatre morceaux qui se remplacent ----------
      qa(".p2-sub .p2-sw").forEach(function (wd) {
        var t0 = parseFloat(wd.getAttribute("data-cue")), inb = wd.classList.contains("inb");
        fl(wd, { opacity: 0, y: 10, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, t0);
        if (!inb) fl(wd, { color: "rgba(11,34,41,0.35)" }, { color: "rgba(11,34,41,1)", duration: 0.2, ease: "power1.out" }, t0 + 0.08);
      });
      qa(".p2-inkbg").forEach(function (b) { fl(b, { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, parseFloat(b.getAttribute("data-trace"))); });
      function subOut(id, t0) {
        var els = qa("#p2-" + id + " .p2-sw").concat(qa("#p2-" + id + " .p2-inkbg")).concat(qa("#p2-" + id + " .p2-trait"));
        fl(els, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, t0);
      }
      subOut("s1", 0.76); subOut("s2", 2.80); subOut("s3", 3.84); subOut("s4", 5.40);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();

  </script>
